name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            bin="annophis-text-service"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            stage="annophis-text-service_${version}_${os}_${arch}"
            mkdir -p "dist/${stage}"
            echo "building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/${stage}/${bin}${ext}" ./cmd/annophis-text-service
            cp LICENSE README.md config.example.json "dist/${stage}/"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -qr "${stage}.zip" "${stage}")
            else
              (cd dist && tar -czf "${stage}.tar.gz" "${stage}")
            fi
            rm -rf "dist/${stage}"
          done
          echo "--- artifacts ---"
          ls -1 dist

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum * > checksums.txt)
          cat dist/checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
